name: Updater
run-name: Updating Calendar
on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

permissions:
  contents: write

jobs:
  Regular-Update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4  # Latest stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5  # Latest stable
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python src/main.py

      - name: Deploy dist branch
        uses: crazy-max/ghaction-github-pages@v4  # Fixed version
        with:
          target_branch: dist
          build_dir: dist  # FIXED: Deploy ONLY dist/ folder
          keep_history: true
          commit_message: "chore: renew calendar.ics [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
